# ==============================================================================
# FLOWRA APPLICATION CONFIGURATION
# ==============================================================================
# Automatically import .env file if present in the project root directory
spring.config.import=optional:file:.env[.properties]

spring.application.name=${SPRING_APPLICATION_NAME:flowra-backend}
# Render and cloud platforms dynamically inject PORT env variable; fallback to SERVER_PORT or 8080
server.port=${PORT:${SERVER_PORT:8080}}

# ------------------------------------------------------------------------------
# MYSQL DATABASE CONNECTION STRING
# ------------------------------------------------------------------------------
# Parameters:
#  - createDatabaseIfNotExist=true: Automatically creates 'flowra_db' if it doesn't exist
#  - useSSL=false: Disables SSL requirement for local localhost development
#  - allowPublicKeyRetrieval=true: Required for MySQL 8.0 default caching_sha2_password authentication
#  - serverTimezone=Asia/Kolkata: Configures Indian Standard Time for order timestamps
spring.datasource.url=${DB_URL:${DATABASE_URL:jdbc:mysql://localhost:3306/flowra_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1212}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# ------------------------------------------------------------------------------
# HIBERNATE / JPA CONFIGURATION
# ------------------------------------------------------------------------------
# Automatically creates or updates table schema based on your @Entity models
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# ------------------------------------------------------------------------------
# JSON / JACKSON CONFIGURATION
# ------------------------------------------------------------------------------
spring.jackson.serialization.indent-output=true
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# ------------------------------------------------------------------------------
# MULTIPART FILE UPLOAD (FOR PRODUCT & CATEGORY IMAGES)
# ------------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# ------------------------------------------------------------------------------
# LOGGING
# ------------------------------------------------------------------------------
logging.level.org.springframework.web=${LOG_LEVEL_SPRING:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_HIBERNATE:DEBUG}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

