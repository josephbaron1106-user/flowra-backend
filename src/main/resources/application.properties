# ==============================================================================
# FLOWRA BACKEND CONFIGURATION (Spring Boot 3 + Java 21)
# Production Ready for Render Deployment & Railway MySQL Integration
# ==============================================================================

# 1. Environment file import (Optional: for local development via .env)
spring.config.import=optional:file:.env[.properties]

spring.application.name=${SPRING_APPLICATION_NAME:flowra-backend}

# 2. Server Port & Network Binding
# Render assigns a dynamic port via the PORT environment variable (default: 8080)
server.port=${PORT:8080}
server.address=0.0.0.0

# 3. Database DataSource (MySQL via Railway TCP Proxy or Localhost)
# DB_URL MUST be formatted as a valid JDBC URL: jdbc:mysql://HOST:PORT/DATABASE
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP) settings optimized for cloud stability
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1

# 4. JPA / Hibernate ORM Configuration
# Explicit MySQL dialect ensures Hibernate doesn't fail even before metadata retrieval
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=true

# 5. JSON / Jackson Serialization
spring.jackson.serialization.indent-output=true
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# 6. Multipart File Upload Limits
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# 7. Logging Configuration
logging.level.org.springframework.web=${LOG_LEVEL_SPRING:INFO}
logging.level.org.hibernate.SQL=${LOG_LEVEL_HIBERNATE:WARN}
logging.level.com.flowra.flowra_backend=INFO
logging.level.com.zaxxer.hikari=INFO

# 8. Razorpay Payment Gateway Credentials (Server-side only)
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.currency=${RAZORPAY_CURRENCY:INR}
razorpay.company.name=${RAZORPAY_COMPANY_NAME:FLOWRA Artisanal Florist}